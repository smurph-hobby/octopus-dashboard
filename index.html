<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agile Octopus Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
    text-align:center;
}

h1{
    font-size:2rem;
    margin-bottom:25px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    margin:20px auto;
    max-width:900px;
    box-shadow:0 0 15px rgba(0,0,0,0.35);
}

.card h2{
    margin-top:0;
    color:#cccccc;
}

.value{
    font-size:3rem;
    font-weight:bold;
    margin-top:10px;
}

.green{
    color:#4CAF50;
}

.orange{
    color:#FFC107;
}

.red{
    color:#F44336;
}

.period-price{
    font-size:2rem;
    font-weight:bold;
    margin-bottom:10px;
}

.period-time{
    font-size:1.2rem;
    color:#bbbbbb;
}

.updated{
    margin-top:25px;
    color:#999999;
    font-size:0.85rem;
}

canvas{
    width:100% !important;
    height:350px !important;
}

</style>
</head>

<body>

<h1>⚡ Agile Octopus</h1>

<div class="card">
    <h2>Current Price</h2>
    <div id="current" class="value">Loading...</div>
</div>

<div class="card">
    <h2>Next Price</h2>
    <div id="next" class="value">Loading...</div>
</div>

<div class="card">
    <h2>Best Laundry Window (2 Hours)</h2>
    <div id="laundry">Loading...</div>
</div>

<div class="card">
    <h2>Cheapest Next 24 Hours</h2>
    <div id="cheap">Loading...</div>
</div>

<div class="card">
    <h2>Most Expensive Next 24 Hours</h2>
    <div id="high">Loading...</div>
</div>

<div class="card">
    <h2>30 Hour Agile Forecast</h2>
    <canvas id="priceChart"></canvas>
</div>

<div class="updated" id="updated"></div>

<script>

const api =
"https://octopusapi-dvaddkaqd3g2aqhj.ukwest-01.azurewebsites.net/api/agile-pricing";

let chart;

function getColour(price){

    if(price < 10) return "green";
    if(price < 25) return "orange";
    return "red";
}

function formatTime(dateString){

    return new Date(dateString)
        .toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

function buildPeriodHtml(period){

    return `
        <div class="period-price">
            ${period.price.toFixed(2)} p/kWh
        </div>

        <div class="period-time">
            ${formatTime(period.from)}
            -
            ${formatTime(period.to)}
        </div>
    `;
}

function buildLaundryHtml(window){

    return `
        <div class="period-price">
            ${window.average.toFixed(2)} p/kWh
        </div>

        <div class="period-time">
            ${formatTime(window.from)}
            -
            ${formatTime(window.to)}
        </div>
    `;
}

function renderChart(graph){

    const labels = graph.map(point => {

        const d = new Date(point.time);

        return d.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
    });

    const values =
        graph.map(point => point.price);

    const ctx =
        document.getElementById("priceChart");

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: [{
                label: "Agile Rate (p/kWh)",
                data: values,

                borderColor: "#4FC3F7",
                backgroundColor: "rgba(79,195,247,0.15)",

                fill: true,

                tension: 0.25,

                pointRadius: 3,
                pointHoverRadius: 6
            }]
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {
                    labels: {
                        color: "white"
                    }
                }
            },

            scales: {

                x: {

                    ticks: {
                        color: "#cccccc",
                        maxTicksLimit: 12
                    },

                    grid: {
                        color: "#333333"
                    }
                },

                y: {

                    beginAtZero: false,

                    ticks: {
                        color: "#cccccc"
                    },

                    grid: {
                        color: "#333333"
                    }
                }
            }
        }
    });
}

async function loadData(){

    try{

        const response =
            await fetch(api);

        const data =
            await response.json();

        const current =
            document.getElementById("current");

        current.textContent =
            `${data.current.toFixed(2)} p/kWh`;

        current.className =
            `value ${getColour(data.current)}`;


        const next =
            document.getElementById("next");

        next.textContent =
            `${data.next.toFixed(2)} p/kWh`;

        next.className =
            `value ${getColour(data.next)}`;


        document.getElementById("cheap").innerHTML =
            data.cheapest
                ? buildPeriodHtml(data.cheapest)
                : "Not available";


        document.getElementById("high").innerHTML =
            data.highest
                ? buildPeriodHtml(data.highest)
                : "Not available";


        document.getElementById("laundry").innerHTML =
            data.bestLaundryWindow
                ? buildLaundryHtml(
                      data.bestLaundryWindow
                  )
                : "Not available";


        renderChart(data.graph);


        document.getElementById("updated")
            .textContent =
            "Last updated: "
            + new Date().toLocaleString();

    }
    catch(error){

        console.error(error);

        document.getElementById("current")
            .innerText =
            "Unable to load pricing";
    }
}

loadData();

setInterval(loadData, 300000);

</script>

</body>
</html>
