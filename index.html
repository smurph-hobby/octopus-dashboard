<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agile Octopus Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:20px;
    margin:15px auto;
    max-width:1000px;
    box-shadow:0 0 12px rgba(0,0,0,.4);
}

.value{
    font-size:2.8rem;
    font-weight:bold;
}

.subtext{
    color:#bbbbbb;
    font-size:1rem;
    margin-top:5px;
}

.period-price{
    font-size:2rem;
    font-weight:bold;
}

.period-time{
    font-size:1.1rem;
    color:#bbbbbb;
}

.green{
    color:#4CAF50;
}

.orange{
    color:#FFC107;
}

.red{
    color:#F44336;
}

.indicator{
    font-size:2rem;
    font-weight:bold;
}

.indicator-small{
    color:#bbbbbb;
    margin-top:10px;
}

canvas{
    width:100% !important;
    height:420px !important;
}

.legend{
    color:#bbbbbb;
    margin-top:10px;
}

.updated{
    color:#999999;
    margin-top:20px;
    font-size:0.85rem;
}

</style>
</head>
<body>

<h1>⚡ Agile Octopus</h1>

<div class="card">
    <h2>Current Price</h2>
    <div id="current" class="value"></div>
    <div id="currentTime" class="subtext"></div>
</div>

<div class="card">
    <h2>Next Price</h2>
    <div id="next" class="value"></div>
    <div id="nextTime" class="subtext"></div>
</div>

<div class="card">
    <h2>Laundry Recommendation</h2>
    <div id="runIndicator"></div>
</div>

<div class="card">
    <h2>Best Laundry Window (Next 30 Hours)</h2>
    <div id="laundry"></div>
</div>

<div class="card">
    <h2>Cheapest Next 24 Hours</h2>
    <div id="cheap"></div>
</div>

<div class="card">
    <h2>Most Expensive Next 24 Hours</h2>
    <div id="high"></div>
</div>

<div class="card">
    <h2>Savings Opportunity</h2>
    <div id="savings"></div>
</div>

<div class="card">

    <h2>30 Hour Agile Forecast</h2>

    <canvas id="priceChart"></canvas>

    <div class="legend">
        🟦 Tomorrow |
        🟩 Laundry Window |
        │ Midnight
    </div>

</div>

<div id="updated" class="updated"></div>
