<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agile Octopus Dashboard</title>

<style>

body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
    text-align:center;
}

h1{
    font-size:2.2rem;
    margin-bottom:25px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:25px;
    margin:20px auto;
    max-width:500px;
    box-shadow:0 0 15px rgba(0,0,0,0.35);
}

.card h2{
    margin-top:0;
    color:#cccccc;
}

.value{
    font-size:3rem;
    font-weight:bold;
    margin-top:10px;
}

.green{
    color:#4CAF50;
}

.orange{
    color:#FFC107;
}

.red{
    color:#F44336;
}

.period-price{
    font-size:2rem;
    font-weight:bold;
    margin-bottom:10px;
}

.period-time{
    font-size:1.2rem;
    color:#bbbbbb;
}

.updated{
    margin-top:25px;
    color:#999999;
    font-size:0.85rem;
}

</style>
</head>

<body>

<h1>⚡ Agile Octopus</h1>

<div class="card">
    <h2>Current Price</h2>
    <div id="current" class="value">Loading...</div>
</div>

<div class="card">
    <h2>Next Price</h2>
    <div id="next" class="value">Loading...</div>
</div>

<div class="card">
    <h2>Cheapest Next 24 Hours</h2>
    <div id="cheap"></div>
</div>

<div class="card">
    <h2>Most Expensive Next 24 Hours</h2>
    <div id="high"></div>
</div>

<div class="updated" id="updated"></div>

<script>

const api =
"https://octopusapi-dvaddkaqd3g2aqhj.ukwest-01.azurewebsites.net/api/agile-pricing";

function getColour(price){

    if(price < 10){
        return "green";
    }

    if(price < 20){
        return "orange";
    }

    return "red";
}

function formatTime(dateString){

    return new Date(dateString).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

function buildPeriodHtml(period){

    return `
        <div class="period-price">
            ${period.price.toFixed(2)} p/kWh
        </div>
        <div class="period-time">
            ${formatTime(period.from)}
            -
            ${formatTime(period.to)}
        </div>
    `;
}

async function loadData(){

    try{

        const response = await fetch(api);
        const data = await response.json();

        const currentElement =
            document.getElementById("current");

        currentElement.textContent =
            `${data.current.toFixed(2)} p/kWh`;

        currentElement.className =
            `value ${getColour(data.current)}`;


        const nextElement =
            document.getElementById("next");

        nextElement.textContent =
            `${data.next.toFixed(2)} p/kWh`;

        nextElement.className =
            `value ${getColour(data.next)}`;


        document.getElementById("cheap").innerHTML =
            buildPeriodHtml(data.cheapest);

        document.getElementById("high").innerHTML =
            buildPeriodHtml(data.highest);


        document.getElementById("updated").textContent =
            `Last updated: ${new Date().toLocaleString()}`;

    }

    catch(error){

        console.error(error);

        document.getElementById("current").innerHTML =
            "Unable to load pricing";

        document.getElementById("next").innerHTML =
            "-";

        document.getElementById("cheap").innerHTML =
            "-";

        document.getElementById("high").innerHTML =
            "-";
    }
}

loadData();

setInterval(loadData, 300000);

</script>

</body>
</html>
