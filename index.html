<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agile Octopus Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#1e1e1e;
    border-radius:20px;
    padding:20px;
    margin:15px auto;
    max-width:1000px;
    box-shadow:0 0 12px rgba(0,0,0,.4);
}

.value{
    font-size:2.8rem;
    font-weight:bold;
}

.subtext{
    color:#bbbbbb;
    margin-top:5px;
}

.period-price{
    font-size:2rem;
    font-weight:bold;
}

.period-time{
    color:#bbbbbb;
    margin-top:5px;
}

.green{
    color:#4CAF50;
}

.orange{
    color:#FFC107;
}

.red{
    color:#F44336;
}

.indicator{
    font-size:2rem;
    font-weight:bold;
}

.indicator-small{
    margin-top:10px;
    color:#bbbbbb;
}

.mode-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.mode-button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    cursor:pointer;
}

.mode-button.active{
    background:#4CAF50;
}

canvas{
    width:100% !important;
    height:420px !important;
}

.legend{
    color:#bbbbbb;
    margin-top:10px;
}

.updated{
    color:#999;
    margin-top:20px;
    font-size:0.85rem;
}

</style>
</head>
<body>

<h1>⚡ Agile Octopus</h1>

<div class="card">
    <h2>Current Price</h2>
    <div id="current" class="value"></div>
    <div id="currentTime" class="subtext"></div>
</div>

<div class="card">
    <h2>Next Price</h2>
    <div id="next" class="value"></div>
    <div id="nextTime" class="subtext"></div>
</div>

<div class="card">
    <h2>Recommendation</h2>

    <div class="mode-buttons">

        <button
            class="mode-button active"
            onclick="changeMode('wm')"
            id="btn-wm">
            Washing Machine
        </button>

        <button
            class="mode-button"
            onclick="changeMode('dryer')"
            id="btn-dryer">
            Dryer
        </button>

        <button
            class="mode-button"
            onclick="changeMode('laundry')"
            id="btn-laundry">
            Wash + Dry
        </button>

    </div>

    <div id="recommendation"></div>
</div>


<div class="card">
    <h2 id="windowTitle">
        Best Washing Machine Window
    </h2>

    <div id="selectedWindow"></div>
</div>


<div class="card">
    <h2>Cheapest Next 24 Hours</h2>
    <div id="cheap"></div>
</div>

<div class="card">
    <h2>Most Expensive Next 24 Hours</h2>
    <div id="high"></div>
</div>

<div class="card">
    <h2>Run Cost Comparison</h2>
    <div id="saving"></div>
</div>

<div class="card">

    <h2>30 Hour Forecast</h2>

    <canvas id="priceChart"></canvas>

    <div class="legend">
        🟦 Tomorrow &nbsp;&nbsp;
        🟩 Selected Appliance Window
    </div>

</div>

<div class="updated" id="updated"></div>

<script>

const api =
"https://octopusapi-dvaddkaqd3g2aqhj.ukwest-01.azurewebsites.net/api/agile-pricing";

let chart;
let dashboardData;
let selectedMode = "wm";

function formatTime(date){

    return new Date(date)
        .toLocaleTimeString(
            [],
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );
}

function colour(price){

    if(price < 10)
        return "green";

    if(price < 25)
        return "orange";

    return "red";
}

function periodHtml(period){

    return `
        <div class="period-price">
            ${period.price.toFixed(2)} p/kWh
        </div>

        <div class="period-time">
            ${formatTime(period.from)}
            -
            ${formatTime(period.to)}
        </div>
    `;
}

function windowHtml(window){

    return `
        <div class="period-price">
            ${window.average.toFixed(2)} p/kWh
        </div>

        <div class="period-time">
            ${formatTime(window.from)}
            -
            ${formatTime(window.to)}
        </div>
    `;
}

function currentWindow(){

    if(selectedMode === "wm")
        return dashboardData.bestWashingMachineWindow;

    if(selectedMode === "dryer")
        return dashboardData.bestDryerWindow;

    return dashboardData.bestLaundryWindow;
}

function currentTitle(){

    if(selectedMode === "wm")
        return "Best Washing Machine Window";

    if(selectedMode === "dryer")
        return "Best Dryer Window";

    return "Best Wash + Dry Window";
}

function buildRecommendation(){

    const window =
        currentWindow();

    const current =
        dashboardData.current;

    const start =
        new Date(window.from);

    const now =
        new Date();

const when =
    new Date(window.from)
    .toLocaleString(
        [],
        {
            weekday: 'short',
            hour: '2-digit',
            minute: '2-digit'
        }
    );

    const hoursUntil =
        (start - now) /
        (1000 * 60 * 60);

let applianceKwh;

if(selectedMode === "wm"){

    applianceKwh =
        dashboardData.appliances
            .washingMachineKwh;
}
else if(selectedMode === "dryer"){

    applianceKwh =
        dashboardData.appliances
            .dryerKwh;
}
else{

    applianceKwh =
        dashboardData.appliances
            .washDryKwh;
}

const cycleSaving =
    Math.max(
        0,
        (
            current -
            window.average
        ) *
        applianceKwh
    );

let text;
let colour;
let subtitle;

if(
    now >= start &&
    now <= new Date(window.to)
){

    text = "🟢 Run Now";

    colour = "#4CAF50";

    subtitle =
        "You are currently within the recommended window";
}
else if(cycleSaving <= 5){

    text = "🟢 Run Now";

    colour = "#4CAF50";

    subtitle =
        "Potential saving is minimal";
}
else if(hoursUntil > 2){

    text = "🟠 Wait";

    colour = "#FFC107";

    subtitle =
        `Best time starts ${when} and could save approximately ${cycleSaving.toFixed(1)}p`;
}
else{

    text = "🟠 Wait";

    colour = "#FFC107";

    subtitle =
        `Save approximately ${cycleSaving.toFixed(1)}p from ${when}`;
}

return `
    <div
        class="indicator"
        style="color:${colour}">
        ${text}
    </div>
    <div class="indicator-small">
        ${subtitle}
    </div>
`;
}

const shadingPlugin = {

    id:'shadingPlugin',

    beforeDraw(chart){

        const {
            ctx,
            chartArea,
            scales
        } = chart;

        if(!chartArea)
            return;

        ctx.save();

        const dates =
            chart.rawDates;

        const tomorrow =
            new Date();

        tomorrow.setHours(
            24,0,0,0
        );

        let midnightIdx = null;

        dates.forEach((d,i)=>{

            if(
                midnightIdx === null &&
                new Date(d) >= tomorrow
            ){
                midnightIdx = i;
            }
        });

        if(midnightIdx !== null){

            const x =
                scales.x.getPixelForValue(
                    midnightIdx
                );

            ctx.fillStyle =
                "rgba(66,165,245,0.1)";

            ctx.fillRect(
                x,
                chartArea.top,
                chartArea.right - x,
                chartArea.bottom-chartArea.top
            );

            ctx.strokeStyle =
                "rgba(66,165,245,.8)";

            ctx.beginPath();
            ctx.moveTo(x, chartArea.top);
            ctx.lineTo(x, chartArea.bottom);
            ctx.stroke();
        }

        if(
            chart.highlightStart !== undefined
        ){

            const s =
                scales.x.getPixelForValue(
                    chart.highlightStart
                );

            const e =
                scales.x.getPixelForValue(
                    chart.highlightEnd
                );

            ctx.fillStyle =
                "rgba(76,175,80,0.25)";

            ctx.fillRect(
                s,
                chartArea.top,
                e-s,
                chartArea.bottom-chartArea.top
            );
        }

        ctx.restore();
    }
};

function renderChart(){

    const graph =
        dashboardData.graph;

    const labels =
        graph.map(
            x => formatTime(x.time)
        );

    const values =
        graph.map(
            x => x.price
        );

    const ctx =
        document.getElementById(
            "priceChart"
        );

    if(chart)
        chart.destroy();

    chart = new Chart(ctx, {

        type:'line',

        plugins:[
            shadingPlugin
        ],

        data:{

            labels,

            datasets:[{

                label:
                    "Agile Price (p/kWh)",

                data: values,

                borderColor:"#4FC3F7",

                backgroundColor:
                    "rgba(79,195,247,0.15)",

                fill:true,

                tension:.25
            }]
        },

        options:{

            responsive:true,

            maintainAspectRatio:false,

            scales:{

                x:{
                    ticks:{
                        color:"#ccc",
                        maxTicksLimit:12
                    },

                    grid:{
                        color:"#333"
                    }
                },

                y:{
                    ticks:{
                        color:"#ccc"
                    },

                    grid:{
                        color:"#333"
                    }
                }
            },

            plugins:{

                legend:{
                    labels:{
                        color:"white"
                    }
                }
            }
        }
    });

    chart.rawDates =
        graph.map(
            p => p.time
        );

    const win =
        currentWindow();

    chart.highlightStart =
        graph.findIndex(
            p =>
                p.time ===
                win.from
        );

    chart.highlightEnd =
        graph.findIndex(
            p =>
                p.time ===
                win.to
        );

const slotCount =
    selectedMode === "laundry"
        ? 4
        : 2;

chart.highlightEnd =
    chart.highlightStart +
    slotCount;

    chart.update();
}

function changeMode(mode){

    selectedMode = mode;

    document
        .querySelectorAll(
            '.mode-button'
        )
        .forEach(
            b => b.classList.remove(
                'active'
            )
        );

    document
        .getElementById(
            `btn-${mode}`
        )
        .classList.add(
            'active'
        );

    updateDisplay();
}

function updateDisplay(){

    document
        .getElementById(
            "windowTitle"
        )
        .textContent =
        currentTitle();

    document
        .getElementById(
            "selectedWindow"
        )
        .innerHTML =
        windowHtml(
            currentWindow()
        );

    document
        .getElementById(
            "recommendation"
        )
        .innerHTML =
        buildRecommendation();

   let applianceKwh;
let applianceName;

if(selectedMode === "wm"){

    applianceKwh =
        dashboardData.appliances
            .washingMachineKwh;

    applianceName =
        "Washing Machine";
}
else if(selectedMode === "dryer"){

    applianceKwh =
        dashboardData.appliances
            .dryerKwh;

    applianceName =
        "Tumble Dryer";
}
else{

    applianceKwh =
        dashboardData.appliances
            .washDryKwh;

    applianceName =
        "Wash + Dry";
}

const currentCost =
    (
        dashboardData.current *
        applianceKwh
    ) / 100;

const recommendedCost =
    (
        currentWindow().average *
        applianceKwh
    ) / 100;

const saving =
    Math.max(
        0,
        currentCost -
        recommendedCost
    );

const savingColour =
    saving > 0
    ? "#4CAF50"
    : "#FFC107";

const savingText =
    saving > 0
    ? `${(saving*100).toFixed(0)}p`
    : "0p";

document
    .getElementById(
        "saving"
    )
    .innerHTML = `

    <div class="period-price">

        £${currentCost.toFixed(2)}

        →

        £${recommendedCost.toFixed(2)}

    </div>

    <div class="period-time">

        ${applianceName}

    </div>

    <div
        class="period-time"
        style="color:${savingColour};font-weight:bold;"
    >

        Saving:
        ${savingText}

    </div>

`;

    renderChart();
}

async function loadData(){

    try{

        const response =
            await fetch(api);

        if(!response.ok){
            throw new Error(
                "Unable to retrieve pricing"
            );
        }

        dashboardData =
            await response.json();

        document
    .getElementById(
        "current"
    )
    .textContent =
    `${dashboardData.current.toFixed(2)} p/kWh`;

document
    .getElementById(
        "current"
    )
    .className =
    `value ${colour(dashboardData.current)}`;

document
    .getElementById(
        "currentTime"
    )
    .textContent =
    `${formatTime(dashboardData.current_from)} - ${formatTime(dashboardData.current_to)}`;

document
    .getElementById(
        "next"
    )
    .textContent =
    `${dashboardData.next.toFixed(2)} p/kWh`;

document
    .getElementById(
        "next"
    )
    .className =
    `value ${colour(dashboardData.next)}`;

document
    .getElementById(
        "nextTime"
    )
    .textContent =
    `${formatTime(dashboardData.next_from)} - ${formatTime(dashboardData.next_to)}`;

document
    .getElementById(
        "cheap"
    )
    .innerHTML =
    periodHtml(
        dashboardData.cheapest
    );

document
    .getElementById(
        "high"
    )
    .innerHTML =
    periodHtml(
        dashboardData.highest
    );

document
    .getElementById(
        "updated"
    )
    .textContent =
    "Last updated: "
    + new Date()
    .toLocaleString();

updateDisplay();

    }
    catch(error){

        console.error(error);

        document
            .getElementById(
                "current"
            )
            .textContent =
            "Data unavailable";
    }
}

loadData();

setInterval(
    loadData,
    300000
);

</script>

</body>
</html>
